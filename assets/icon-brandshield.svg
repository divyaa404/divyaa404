<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" shape-rendering="crispEdges">
  <defs>
    <filter id="glow-shield" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#39D353" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="0" y="0" width="72" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <!-- Matrix Background Scanlines -->
  <path d="M12 20h48 M12 28h48 M12 36h48 M12 44h48 M12 52h48" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Pixel Shield Outer Border (Hexagonal Cyber Crest) -->
  <polygon points="36,15 54,23 54,41 36,57 18,41 18,23" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <!-- Shield Core (Blue & Green Cyber Fill) -->
  <polygon points="36,19 50,25 50,39 36,52 22,39 22,25" fill="#162A45" stroke="#1F6FEB" stroke-width="1"/>

  <!-- AI Core / Neural Node (Center Glowing Diamond) -->
  <polygon points="36,26 44,34 36,42 28,34" fill="#39D353" opacity="0.9" filter="url(#glow-shield)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
  <rect x="34" y="32" width="4" height="4" fill="#F0F6FC"/>

  <!-- Neural Connection Nodes & Data Circuit Tracks -->
  <line x1="36" y1="20" x2="36" y2="26" stroke="#39D353" stroke-width="2"/>
  <line x1="36" y1="42" x2="36" y2="48" stroke="#39D353" stroke-width="2"/>
  <line x1="23" y1="34" x2="28" y2="34" stroke="#1F6FEB" stroke-width="2"/>
  <line x1="44" y1="34" x2="49" y2="34" stroke="#1F6FEB" stroke-width="2"/>

  <!-- Approval / Governance Checkmark Pixels (Green Pulse) -->
  <rect x="32" y="34" width="3" height="3" fill="#F0F6FC"/>
  <rect x="35" y="37" width="3" height="3" fill="#F0F6FC"/>
  <rect x="38" y="31" width="3" height="3" fill="#F0F6FC"/>
  <rect x="41" y="28" width="3" height="3" fill="#F0F6FC"/>

  <!-- Glowing Perimeter Radar Pulse -->
  <circle cx="36" cy="34" r="16" fill="none" stroke="#39D353" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
    <animate attributeName="r" values="12;20;12" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
