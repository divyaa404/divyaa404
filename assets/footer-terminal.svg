<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="100%" height="50">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #39D353; }
    .mono-cmd { font-family: 'Courier New', monospace; font-size: 12px; fill: #F0F6FC; }
    .mono-accent { font-family: 'Courier New', monospace; font-size: 12px; fill: #39D353; font-weight: bold; }
    .status-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #9BA3AE; }
  </style>
  <rect x="2" y="2" width="896" height="46" rx="6" fill="url(#footerBg)" stroke="#30363D" stroke-width="1.5"/>
  <text x="20" y="29" class="mono-accent">&gt;</text>
  <text x="36" y="29" class="mono-cmd">echo &quot;Architecting high-impact systems. Open for visionary engineering collaborations.&quot;</text>
  <rect x="800" y="19" width="7" height="13" class="cursor"/>
</svg>
