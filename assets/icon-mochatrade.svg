<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" shape-rendering="crispEdges">
  <defs>
    <filter id="glow-trade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#39D353" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="0" y="0" width="72" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <!-- Chart Grid -->
  <path d="M14 20h44 M14 30h44 M14 40h44 M14 50h44" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M22 14v44 M32 14v44 M42 14v44 M52 14v44" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Candlestick 1 (Bearish red/charcoal) -->
  <line x1="22" y1="28" x2="22" y2="46" stroke="#DA3633" stroke-width="1"/>
  <rect x="20" y="32" width="4" height="10" fill="#DA3633"/>

  <!-- Candlestick 2 (Bullish green) -->
  <line x1="32" y1="22" x2="32" y2="48" stroke="#39D353" stroke-width="1"/>
  <rect x="30" y="26" width="4" height="16" fill="#39D353"/>

  <!-- Candlestick 3 (Bullish green high volume) -->
  <line x1="42" y1="18" x2="42" y2="42" stroke="#39D353" stroke-width="1"/>
  <rect x="40" y="20" width="4" height="14" fill="#39D353"/>

  <!-- Candlestick 4 (Breakout) -->
  <line x1="52" y1="14" x2="52" y2="34" stroke="#39D353" stroke-width="1"/>
  <rect x="50" y="16" width="4" height="12" fill="#39D353" filter="url(#glow-trade)"/>

  <!-- Trend Line Overlay -->
  <polyline points="18,44 28,34 38,24 50,16" fill="none" stroke="#1F6FEB" stroke-width="2"/>
  <circle cx="50" cy="16" r="3" fill="#39D353">
    <animate attributeName="r" values="2;5;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Currency / Coffee Tech Badge at Bottom -->
  <rect x="20" y="54" width="32" height="6" rx="2" fill="#21262D"/>
  <rect x="24" y="56" width="10" height="2" fill="#39D353"/>
  <rect x="38" y="56" width="10" height="2" fill="#1F6FEB"/>
</svg>
