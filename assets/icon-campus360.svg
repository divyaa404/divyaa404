<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" shape-rendering="crispEdges">
  <defs>
    <filter id="glow-campus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#1F6FEB" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="0" y="0" width="72" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <!-- Grid lines -->
  <path d="M12 20h48 M12 28h48 M12 36h48 M12 44h48 M12 52h48" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M20 12v48 M28 12v48 M36 12v48 M44 12v48 M52 12v48" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Pixel Academic Building / Portal Dome -->
  <polygon points="36,16 18,26 54,26" fill="#1F6FEB"/>
  <rect x="33" y="12" width="6" height="4" fill="#39D353"/>
  <rect x="35" y="8" width="2" height="4" fill="#9BA3AE"/>

  <!-- Building Pillars -->
  <rect x="22" y="28" width="4" height="20" fill="#9BA3AE"/>
  <rect x="30" y="28" width="4" height="20" fill="#F0F6FC"/>
  <rect x="38" y="28" width="4" height="20" fill="#F0F6FC"/>
  <rect x="46" y="28" width="4" height="20" fill="#9BA3AE"/>

  <!-- Arch / Entrance Doorway -->
  <rect x="32" y="38" width="8" height="14" fill="#0D1117"/>
  <circle cx="36" cy="38" r="4" fill="#39D353">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Base Foundation Steps -->
  <rect x="16" y="48" width="40" height="4" fill="#30363D"/>
  <rect x="14" y="52" width="44" height="4" fill="#21262D"/>

  <!-- 360-degree Orbiting Sync Ring -->
  <circle cx="36" cy="34" r="16" fill="none" stroke="#39D353" stroke-width="1.5" stroke-dasharray="4,4">
    <animateTransform attributeName="transform" type="rotate" from="0 36 34" to="360 36 34" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
