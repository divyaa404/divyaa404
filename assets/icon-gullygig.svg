<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" shape-rendering="crispEdges">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#1F6FEB" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="0" y="0" width="72" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <path d="M12 20h48 M12 28h48 M12 36h48 M12 44h48 M12 52h48" stroke="#1F242C" stroke-width="1" shape-rendering="crispEdges"/>
  <path d="M20 12v48 M28 12v48 M36 12v48 M44 12v48 M52 12v48" stroke="#1F242C" stroke-width="1" shape-rendering="crispEdges"/>

  <!-- Pixel Hardhat / Worker Helmet -->
  <rect x="28" y="16" width="16" height="4" fill="#E3B341"/>
  <rect x="24" y="20" width="24" height="6" fill="#F0C654"/>
  <rect x="20" y="26" width="32" height="4" fill="#E3B341"/>
  <rect x="34" y="18" width="4" height="10" fill="#FFFFFF" opacity="0.4"/>
  <!-- Helmet Lamp (Cyber LED) -->
  <rect x="33" y="22" width="6" height="4" fill="#39D353">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Crossed Cyber Tools / ID Badge -->
  <!-- Wrench diagonal pixels -->
  <rect x="22" y="34" width="4" height="4" fill="#9BA3AE"/>
  <rect x="26" y="38" width="4" height="4" fill="#9BA3AE"/>
  <rect x="30" y="42" width="4" height="4" fill="#9BA3AE"/>
  <rect x="34" y="46" width="4" height="4" fill="#9BA3AE"/>
  <rect x="38" y="50" width="4" height="4" fill="#1F6FEB"/>
  <rect x="20" y="32" width="4" height="4" fill="#F0F6FC"/>
  <rect x="24" y="30" width="4" height="4" fill="#F0F6FC"/>

  <!-- Hammer / Ruler diagonal pixels -->
  <rect x="46" y="34" width="4" height="4" fill="#9BA3AE"/>
  <rect x="42" y="38" width="4" height="4" fill="#9BA3AE"/>
  <rect x="38" y="42" width="4" height="4" fill="#9BA3AE"/>
  <rect x="34" y="46" width="4" height="4" fill="#9BA3AE"/>
  <rect x="30" y="50" width="4" height="4" fill="#39D353"/>
  <rect x="48" y="32" width="4" height="4" fill="#F0F6FC"/>
  <rect x="44" y="30" width="4" height="4" fill="#F0F6FC"/>

  <!-- Digital Location / Opportunity Beacon Pin -->
  <rect x="34" y="36" width="4" height="4" fill="#1F6FEB"/>
  <!-- Glowing Pulse Radar Rings -->
  <circle cx="36" cy="38" r="8" fill="none" stroke="#1F6FEB" stroke-width="1" stroke-dasharray="2,2" opacity="0.6">
    <animate attributeName="r" values="4;14;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Base platform line -->
  <rect x="20" y="56" width="32" height="2" fill="#39D353" opacity="0.8"/>
  <rect x="32" y="58" width="8" height="2" fill="#1F6FEB"/>
</svg>
