<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" shape-rendering="crispEdges">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#39D353" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="0" y="0" width="72" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <!-- Subtle Map Grid -->
  <path d="M14 20h44 M14 30h44 M14 40h44 M14 50h44" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M22 14v44 M32 14v44 M42 14v44 M52 14v44" stroke="#1F242C" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Pixel City Skyline (Silhouettes) -->
  <rect x="18" y="32" width="8" height="24" fill="#21262D"/>
  <rect x="28" y="24" width="10" height="32" fill="#30363D"/>
  <rect x="40" y="28" width="8" height="28" fill="#21262D"/>
  <rect x="50" y="36" width="6" height="20" fill="#163B63"/>

  <!-- Skyscraper Windows (Pixel Lights) -->
  <rect x="30" y="28" width="2" height="2" fill="#39D353"/>
  <rect x="34" y="28" width="2" height="2" fill="#F0F6FC"/>
  <rect x="30" y="34" width="2" height="2" fill="#F0F6FC"/>
  <rect x="34" y="34" width="2" height="2" fill="#39D353"/>
  <rect x="30" y="40" width="2" height="2" fill="#39D353"/>
  <rect x="34" y="40" width="2" height="2" fill="#F0F6FC"/>

  <rect x="20" y="36" width="2" height="2" fill="#1F6FEB"/>
  <rect x="23" y="36" width="2" height="2" fill="#F0F6FC"/>
  <rect x="20" y="42" width="2" height="2" fill="#F0F6FC"/>
  <rect x="42" y="32" width="2" height="2" fill="#39D353"/>
  <rect x="42" y="38" width="2" height="2" fill="#1F6FEB"/>

  <!-- Antenna & Beacon -->
  <rect x="32" y="18" width="2" height="6" fill="#9BA3AE"/>
  <rect x="31" y="16" width="4" height="2" fill="#39D353">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Underground Utility Grid / Infrastructure Pipelines -->
  <line x1="16" y1="56" x2="56" y2="56" stroke="#1F6FEB" stroke-width="2"/>
  <line x1="16" y1="59" x2="56" y2="59" stroke="#39D353" stroke-width="1.5"/>

  <!-- Infrastructure Conflict Sync Node (Animated Warning / Resolution Ring) -->
  <circle cx="33" cy="46" r="4" fill="none" stroke="#39D353" stroke-width="1.5">
    <animate attributeName="r" values="3;9;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="31" y="44" width="4" height="4" fill="#39D353" filter="url(#glow-green)"/>
</svg>
