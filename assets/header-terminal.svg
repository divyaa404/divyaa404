<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#39D353" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #39D353; }
    .mono { font-family: 'Courier New', 'Fira Code', 'Press Start 2P', monospace; font-size: 13px; }
    .pixel-title { font-family: 'Courier New', 'Press Start 2P', monospace; font-size: 15px; font-weight: bold; fill: #39D353; letter-spacing: 1px; }
    .subtext { font-family: 'Courier New', monospace; font-size: 11px; fill: #9BA3AE; }
    .status-badge { font-family: 'Courier New', monospace; font-size: 11px; fill: #39D353; font-weight: bold; }
  </style>

  <!-- Main Card Body -->
  <rect x="2" y="2" width="896" height="96" rx="8" fill="url(#termGrad)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <path d="M2 10 C2 5, 5 2, 10 2 L890 2 C895 2, 898 5, 898 10 L898 30 L2 30 Z" fill="#21262D" stroke="#30363D" stroke-width="1"/>
  
  <!-- Terminal Window Control Buttons (Pixel Style) -->
  <rect x="16" y="11" width="8" height="8" rx="2" fill="#DA3633"/>
  <rect x="30" y="11" width="8" height="8" rx="2" fill="#D29922"/>
  <rect x="44" y="11" width="8" height="8" rx="2" fill="#39D353"/>

  <!-- Terminal Window Title -->
  <text x="70" y="18" class="mono" fill="#9BA3AE" font-size="11">bash - divya@mainframe: ~/identity (session: divyaa404-active)</text>

  <!-- Live Status Chip on Top Right -->
  <rect x="735" y="7" width="145" height="16" rx="4" fill="#161B22" stroke="#39D353" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="747" cy="15" r="3.5" fill="#39D353" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="758" y="18" class="status-badge">SYSTEM // ONLINE</text>

  <!-- Terminal Body Command Line -->
  <text x="24" y="58" class="pixel-title">&gt; DIVYA_SHARMA --terminal-init --role=engineer</text>
  <rect x="525" y="46" width="9" height="15" class="cursor"/>

  <!-- Secondary Metadata Line -->
  <text x="24" y="80" class="subtext">ARCHITECTURE: AI/ML &amp; EDGE SYSTEMS | TOP 25 GLOBAL @ HACKHAZARDS &apos;26 | GATE 2027 CSE (IIT ASPIRANT)</text>
</svg>
